server {
    listen 80;
    server_name sitio1.local;

    root /var/www/sitio1;
    index index.html;

    access_log /var/log/nginx/sitio1.access.log codex;
    error_log  /var/log/nginx/sitio1.error.log;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { internal; }
    location = /50x.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }
}
