<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .t{fill:#0f172a;font-size:15px}
      .s{fill:#475569;font-size:13px}
      .m{fill:#0f172a;font-size:13px;font-family:DejaVu Sans Mono, monospace}
      .h{fill:#0f172a;font-size:17px;font-weight:bold}
      .n{fill:#fff;font-size:14px;font-weight:bold}
    </style>
  </defs>
  <rect width="1600" height="1010" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="44" style="font-size:24px;font-weight:bold;fill:#0f172a">Arquitectura cliente-servidor: Nginx con hosts virtuales y backend Node.js</text>
  <text x="40" y="68" class="s">Leonardo Avila Bejarano · Grupo CodeX · Sistemas Operativos II · Universidad Privada Domingo Savio</text>

  <!-- ===== CLIENTE ===== -->
  <rect x="40" y="200" width="320" height="430" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="60" y="232" class="h">Cliente · Windows (anfitrión)</text>
  <text x="60" y="254" class="m">IP 192.168.56.1</text>

  <rect x="60" y="272" width="280" height="74" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="76" y="298" class="t">Navegador + DevTools</text>
  <text x="76" y="320" class="s">Network: método, estado, cabeceras</text>
  <text x="76" y="338" class="s">Application: cookie sid</text>

  <rect x="60" y="358" width="280" height="60" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="76" y="384" class="t">curl.exe -v / -c / -b</text>
  <text x="76" y="404" class="s">Análisis de petición y respuesta</text>

  <rect x="60" y="430" width="280" height="100" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="76" y="456" class="t">Archivo hosts</text>
  <text x="76" y="478" class="m">192.168.56.10  sitio1.local</text>
  <text x="76" y="498" class="m">192.168.56.10  app.local</text>
  <text x="76" y="518" class="s">Resolución de nombres local</text>

  <rect x="60" y="542" width="280" height="70" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="76" y="568" class="t">PowerShell · ssh codex@…</text>
  <text x="76" y="590" class="s">Administración remota (puerto 22)</text>

  <!-- ===== VM ===== -->
  <rect x="470" y="90" width="1090" height="730" rx="16" fill="#f1f5f9" stroke="#334155" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="494" y="122" class="h">VirtualBox · VM Ubuntu Server 26.04 LTS · hostname groupcodex</text>
  <text x="494" y="144" class="s">Red: Adaptador 1 NAT (enp0s3, 10.0.2.15) · Adaptador 2 Solo-anfitrión (enp0s8, 192.168.56.10/24 estática por netplan)</text>

  <!-- UFW -->
  <rect x="494" y="170" width="96" height="560" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text transform="translate(536,450) rotate(-90)" text-anchor="middle" style="font-size:16px;font-weight:bold;fill:#78350f">Firewall UFW</text>
  <text transform="translate(562,450) rotate(-90)" text-anchor="middle" style="font-size:12px;fill:#78350f">deny incoming · allow 22, 80, 443</text>

  <!-- Nginx -->
  <rect x="620" y="170" width="420" height="560" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="640" y="200" class="h">Nginx 1.28 · escucha 0.0.0.0:80</text>
  <text x="640" y="222" class="s">master + 2 workers · systemctl enable · server_tokens off</text>
  <text x="640" y="242" class="s">Elige el host virtual según la cabecera Host (server_name)</text>

  <rect x="640" y="258" width="380" height="170" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="658" y="286" class="t" style="font-weight:bold">Host virtual 1 · sitio1.local</text>
  <text x="658" y="308" class="m">sites-available/sitio1.conf</text>
  <text x="658" y="330" class="s">root /var/www/sitio1 · try_files</text>
  <text x="658" y="352" class="s">error_page 404 → /404.html</text>
  <text x="658" y="374" class="s">error_page 500-504 → /50x.html</text>
  <text x="658" y="396" class="s">Logs: sitio1.access.log / sitio1.error.log</text>

  <rect x="640" y="446" width="380" height="190" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="658" y="474" class="t" style="font-weight:bold">Host virtual 2 · app.local</text>
  <text x="658" y="496" class="m">sites-available/app.conf</text>
  <text x="658" y="518" class="s">Proxy inverso: proxy_pass 127.0.0.1:3000</text>
  <text x="658" y="540" class="s">Host, X-Real-IP, X-Forwarded-For/Proto</text>
  <text x="658" y="562" class="s">proxy_intercept_errors on</text>
  <text x="658" y="584" class="s">Errores propios: /var/www/app-errores (404, 502)</text>
  <text x="658" y="606" class="s">Logs: app.access.log / app.error.log</text>

  <rect x="640" y="652" width="380" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="658" y="676" class="t">/var/log/nginx/</text>
  <text x="658" y="698" class="s">Lectura con tail -f, grep " 404 "</text>

  <!-- Destino sitio1 -->
  <rect x="1090" y="258" width="440" height="170" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1110" y="286" class="t" style="font-weight:bold">Contenido estático</text>
  <text x="1110" y="310" class="m">/var/www/sitio1/</text>
  <text x="1110" y="334" class="m">  index.html   (200 OK)</text>
  <text x="1110" y="356" class="m">  404.html     (página propia)</text>
  <text x="1110" y="378" class="m">  50x.html     (página propia)</text>
  <text x="1110" y="404" class="s">Caché: ETag / Last-Modified → 304</text>

  <!-- Backend -->
  <rect x="1090" y="446" width="440" height="190" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1110" y="474" class="t" style="font-weight:bold">Backend Node.js 22 + Express</text>
  <text x="1110" y="498" class="m">127.0.0.1:3000 (solo localhost)</text>
  <text x="1110" y="522" class="s">Servicio systemd app-sesiones · usuario deploy</text>
  <text x="1110" y="544" class="s">Rutas: /  POST /login  /logout  /api/info</text>
  <text x="1110" y="566" class="s">express-session · cookie sid firmada</text>
  <text x="1110" y="588" class="s">HttpOnly · SameSite=Lax · 30 min</text>
  <text x="1110" y="610" class="s">trust proxy · x-powered-by deshabilitado</text>

  <rect x="1090" y="652" width="440" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1110" y="676" class="t">Sesiones en memoria (MemoryStore)</text>
  <text x="1110" y="698" class="s">Limitación: se pierden al reiniciar → Redis en producción</text>

  <!-- Internet -->
  <rect x="1090" y="740" width="440" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1110" y="764" class="t">enp0s3 (NAT) → Internet</text>
  <text x="1110" y="786" class="s">apt (paquetes) · GitHub por SSH (Grupo-CodeX)</text>

  <!-- ===== FLECHAS ===== -->
  <!-- Cliente → UFW → Nginx -->
  <line x1="360" y1="330" x2="490" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="372" y="318" class="s">HTTP :80</text>
  <line x1="590" y1="330" x2="616" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- respuesta -->
  <line x1="490" y1="360" x2="364" y2="360" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="372" y="380" class="s">Respuesta</text>
  <text x="372" y="396" class="s">+ Set-Cookie</text>

  <!-- SSH -->
  <line x1="340" y1="577" x2="490" y2="577" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="372" y="568" class="s">SSH :22</text>

  <!-- Bloqueado :3000 -->
  <line x1="360" y1="650" x2="488" y2="650" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
  <text x="368" y="642" style="font-size:13px;fill:#dc2626;font-weight:bold">✕ :3000</text>
  <text x="368" y="670" style="font-size:12px;fill:#dc2626">bloqueado</text><text x="368" y="686" style="font-size:12px;fill:#dc2626">(UFW + bind</text><text x="368" y="702" style="font-size:12px;fill:#dc2626">127.0.0.1)</text>

  <!-- Nginx → destinos -->
  <line x1="1020" y1="343" x2="1086" y2="343" stroke="#0369a1" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="1020" y1="541" x2="1086" y2="541" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="1028" y="532" style="font-size:12px;fill:#6d28d9">proxy</text>
  <line x1="1310" y1="636" x2="1310" y2="648" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ===== NÚMEROS ===== -->
  <circle cx="332" cy="456" r="13" fill="#0f172a"/><text x="332" y="461" text-anchor="middle" class="n">1</text>
  <circle cx="420" cy="296" r="13" fill="#0f172a"/><text x="420" y="301" text-anchor="middle" class="n">2</text>
  <circle cx="1040" cy="170" r="13" fill="#0f172a"/><text x="1040" y="175" text-anchor="middle" class="n">3</text>
  <circle cx="1053" cy="320" r="13" fill="#0f172a"/><text x="1053" y="325" text-anchor="middle" class="n">4</text>
  <circle cx="1053" cy="572" r="13" fill="#0f172a"/><text x="1053" y="577" text-anchor="middle" class="n">5</text>
  <circle cx="1510" cy="474" r="13" fill="#0f172a"/><text x="1510" y="479" text-anchor="middle" class="n">6</text>

  <!-- ===== FLUJO ===== -->
  <text x="40" y="862" class="h">Flujo de una petición</text>
  <g class="t" style="font-size:14px">
    <text x="40"  y="892">1. El cliente resuelve sitio1.local / app.local → 192.168.56.10 con el archivo hosts.</text>
    <text x="40"  y="918">2. Conexión TCP al puerto 80 por la red solo-anfitrión; UFW la permite.</text>
    <text x="40"  y="944">3. Nginx lee la cabecera Host y selecciona el server_name correspondiente.</text>
    <text x="820" y="892">4. sitio1.local: Nginx entrega el archivo o su página 404/50x propia.</text>
    <text x="820" y="918">5. app.local: Nginx reenvía al backend en 127.0.0.1:3000 (502 propio si no responde).</text>
    <text x="820" y="944">6. Express crea o lee la sesión con la cookie sid y responde a través de Nginx.</text>
  </g>
  <text x="40" y="984" class="s">Cada petición queda registrada en el access.log del host virtual; los fallos del upstream en su error.log.</text>
</svg>
