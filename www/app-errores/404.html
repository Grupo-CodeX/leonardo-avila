<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · App Grupo CodeX</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center;
       font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#e0e7ff;
       background:radial-gradient(800px 500px at 50% 0%,rgba(167,139,250,.22),transparent 60%),#13112e}
  .box{max-width:560px}
  .code{font-size:140px;font-weight:800;line-height:1;letter-spacing:-4px;
        background:linear-gradient(180deg,#ddd6fe,#a78bfa 60%,#6d28d9);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin-top:12px;font-size:28px}
  p{margin-top:12px;color:#a5b4fc;font-size:17px;line-height:1.6}
  .path{display:inline-block;margin-top:18px;font:15px Consolas,"Courier New",monospace;color:#ddd6fe;
        background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);border-radius:8px;padding:8px 14px;word-break:break-all}
  a{display:inline-block;margin-top:28px;padding:12px 26px;border-radius:10px;background:#a78bfa;color:#13112e;font-weight:700;text-decoration:none}
  a:hover{background:#c4b5fd}
  small{display:block;margin-top:36px;color:#6366f1;font-size:13px}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Recurso no encontrado</h1>
    <p>La aplicación de <b>app.local</b> no tiene esta ruta.</p>
    <div class="path" id="ruta">/</div><br>
    <a href="/">Volver a la aplicación</a>
    <small>Nginx (proxy inverso) · app.local · Grupo CodeX</small>
  </div>
  <script>document.getElementById('ruta').textContent = location.pathname;</script>
</body>
</html>
