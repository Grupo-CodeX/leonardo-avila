<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>502 · Backend no disponible</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center;
       font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#e0e7ff;
       background:radial-gradient(800px 500px at 50% 0%,rgba(248,113,113,.18),transparent 60%),#13112e}
  .box{max-width:620px}
  .code{font-size:140px;font-weight:800;line-height:1;letter-spacing:-4px;
        background:linear-gradient(180deg,#fecaca,#f87171 60%,#b91c1c);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin-top:12px;font-size:28px}
  p{margin-top:12px;color:#a5b4fc;font-size:17px;line-height:1.6}
  .chain{margin:28px auto 0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font:14px Consolas,"Courier New",monospace}
  .node{padding:10px 14px;border-radius:10px;border:1px solid}
  .ok{color:#bbf7d0;border-color:#22c55e;background:rgba(34,197,94,.10)}
  .down{color:#fecaca;border-color:#f87171;background:rgba(248,113,113,.10)}
  .arrow{color:#6366f1}.x{color:#f87171;font-weight:700}
  a{display:inline-block;margin-top:30px;padding:12px 26px;border-radius:10px;background:#a78bfa;color:#13112e;font-weight:700;text-decoration:none}
  small{display:block;margin-top:36px;color:#6366f1;font-size:13px}
</style>
</head>
<body>
  <div class="box">
    <div class="code">502</div>
    <h1>Bad Gateway · backend no disponible</h1>
    <p>Nginx recibió tu petición, pero no pudo comunicarse con la aplicación Node.js.</p>
    <div class="chain">
      <span class="node ok">Navegador</span><span class="arrow">→</span>
      <span class="node ok">Nginx :80</span><span class="x">✕</span>
      <span class="node down">Node.js 127.0.0.1:3000</span>
    </div>
    <a href="/">Reintentar</a>
    <small>Nginx (proxy inverso) · app.local · Grupo CodeX</small>
  </div>
</body>
</html>
