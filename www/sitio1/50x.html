<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error del servidor</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center;
       font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#e2e8f0;
       background:radial-gradient(800px 500px at 50% 0%,rgba(239,68,68,.14),transparent 60%),#0b1120}
  .box{max-width:560px}
  .code{font-size:140px;font-weight:800;line-height:1;letter-spacing:-4px;
        background:linear-gradient(180deg,#fca5a5,#ef4444 60%,#991b1b);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin-top:12px;font-size:28px}
  p{margin-top:12px;color:#94a3b8;font-size:17px;line-height:1.6}
  a{display:inline-block;margin-top:28px;padding:12px 26px;border-radius:10px;background:#38bdf8;color:#0b1120;font-weight:700;text-decoration:none}
  small{display:block;margin-top:36px;color:#475569;font-size:13px}
</style>
</head>
<body>
  <div class="box">
    <div class="code">50x</div>
    <h1>Error interno del servidor</h1>
    <p>Algo falló al procesar la solicitud. Intenta nuevamente en unos minutos.</p>
    <a href="/">Reintentar</a>
    <small>Nginx · sitio1.local · Grupo CodeX</small>
  </div>
</body>
</html>
